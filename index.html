<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오!오키은 GOLF 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg:       #F4F7FB;
    --primary:  #2C5F8A;
    --accent:   #5BA4CF;
    --light:    #D6E8F7;
    --mint:     #3AAFA9;
    --gold:     #D4A017;
    --silver:   #8A9BA8;
    --text:     #1E2D3D;
    --text2:    #4A6278;
    --card:     #ffffff;
    --border:   #D6E4F0;
    --shadow:   0 4px 20px rgba(44,95,138,0.10);
    --radius:   16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #2C5F8A, #5BA4CF);
    padding: 22px 20px 18px;
    box-shadow: 0 4px 16px rgba(44,95,138,0.25);
  }
  .header-inner {
    max-width: 960px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .title-main {
    font-size: 1.75rem; font-weight: 800;
    color: #fff; letter-spacing: -0.5px; line-height: 1.1;
  }
  .title-sub { font-size: 0.82rem; color: rgba(255,255,255,0.8); margin-top: 3px; font-weight: 400; }
  .title-slogan {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem; color: rgba(255,255,255,0.92);
    letter-spacing: 0.5px; line-height: 1.1; white-space: nowrap;
  }
  .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .header-motto {
    display: flex; align-items: center; gap: 7px;
    color: rgba(255,255,255,0.92); font-size: 0.78rem; font-weight: 700;
    white-space: nowrap; letter-spacing: 0.3px;
  }

  /* ── MAIN ── */
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

  /* ── CARD ── */
  .team-card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 24px;
    border: 1px solid var(--border); overflow: hidden;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, #EBF4FC, #F4F7FB);
    flex-wrap: wrap; gap: 8px;
  }
  .card-title {
    font-size: 1.1rem; font-weight: 700; color: var(--primary);
    display: flex; align-items: center; gap: 8px;
  }
  .card-hint {
    font-size: 0.75rem; color: var(--accent); font-weight: 500;
    padding: 5px 12px; background: rgba(91,164,207,0.1); border-radius: 20px;
    border: 1px solid rgba(91,164,207,0.25);
  }

  /* ── BUTTONS ── */
  .btn {
    border: none; border-radius: 10px; cursor: pointer;
    font-family: 'Pretendard', sans-serif; font-size: 0.8rem; font-weight: 700;
    padding: 8px 14px; transition: all 0.18s; display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-primary   { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #24507A; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(44,95,138,0.3); }
  .btn-accent    { background: var(--accent); color: #fff; }
  .btn-accent:hover  { background: #4A93BB; transform: translateY(-1px); }
  .btn-outline   { background: #fff; color: var(--primary); border: 1.5px solid var(--accent); }
  .btn-outline:hover { background: #EBF4FC; }
  .btn-ghost     { background: transparent; color: var(--text2); border: 1.5px solid var(--border); }
  .btn-ghost:hover   { background: var(--bg); }
  .btn-danger    { background: #E05555; color: #fff; }
  .btn-danger:hover  { background: #C74444; }
  .btn-sm        { padding: 5px 10px; font-size: 0.75rem; border-radius: 8px; }

  /* ── TABLE ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 500px; }
  th {
    background: var(--primary); color: #fff;
    font-size: 0.78rem; font-weight: 700;
    padding: 9px 10px; text-align: center; white-space: nowrap;
  }
  td {
    padding: 8px 10px; text-align: center; font-size: 0.84rem;
    border-bottom: 1px solid #EBF0F5;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #F0F6FC; }

  .score-gold   { color: var(--gold); font-weight: 800; }
  .score-silver { color: var(--silver); font-weight: 700; }
  .score-absent { color: #8FA8BC; font-style: normal; font-size: 0.84rem; font-weight: 600; }

  .tally-row td {
    background: #EBF4FC; font-weight: 700; font-size: 0.8rem;
    border-top: 1.5px solid var(--light); color: var(--primary);
  }
  .tally-label { text-align: left; padding-left: 14px; color: var(--text2); font-size: 0.76rem; }

  .month-cell { font-weight: 700; color: var(--primary); white-space: nowrap; font-size: 0.82rem; }
  .note-cell  { font-size: 0.76rem; color: var(--text2); min-width: 90px; max-width: 160px; }
  .del-cell   { width: 30px; }
  .del-btn    { background: none; border: none; cursor: pointer; color: #B0BEC5; font-size: 0.9rem; line-height: 1; }
  .del-btn:hover { color: #E05555; }

  /* 공식/비공식 뱃지 (클릭 토글 가능) */
  .badge-unofficial {
    display: inline-block; background: #EBF0F5; color: var(--text2);
    border-radius: 6px; padding: 1px 7px; font-size: 0.68rem; font-weight: 700;
    border: 1px solid #C9D8E8; margin-left: 4px; vertical-align: middle;
    cursor: pointer; transition: all 0.18s; user-select: none;
  }
  .badge-unofficial:hover { background: #D6E4F0; color: var(--primary); }
  .badge-official {
    display: inline-block; background: rgba(44,95,138,0.1); color: var(--primary);
    border-radius: 6px; padding: 1px 7px; font-size: 0.68rem; font-weight: 700;
    border: 1px solid var(--light); margin-left: 4px; vertical-align: middle;
    cursor: pointer; transition: all 0.18s; user-select: none;
  }
  .badge-official:hover { background: rgba(44,95,138,0.2); }

  /* 인라인 편집 */
  .editable { cursor: pointer; }
  .editable:hover { background: #D6E8F7 !important; border-radius: 4px; }
  input.inline-edit {
    width: 100%; border: 2px solid var(--accent); border-radius: 6px;
    padding: 3px 6px; font-size: 0.84rem; text-align: center;
    font-family: 'Pretendard', sans-serif; outline: none; background: #EBF4FC;
  }

  /* ── LEADER ── */
  .leader-section {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px 20px;
    border: 1px solid var(--border);
  }
  .leader-title {
    font-size: 1.2rem; font-weight: 800; color: var(--primary);
    text-align: center; margin-bottom: 6px;
  }
  .leader-sub {
    font-size: 0.74rem; color: var(--text2); text-align: center;
    margin-bottom: 18px; font-weight: 400;
  }
  .leader-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .leader-card { border-radius: 12px; padding: 18px 14px; text-align: center; border: 2px solid transparent; }
  .leader-card.gold-card   { background: linear-gradient(135deg,#FFF8E6,#FFF0C0); border-color: #D4A017; }
  .leader-card.silver-card { background: linear-gradient(135deg,#F0F4F8,#E4ECF4); border-color: #8A9BA8; }
  .leader-medal  { font-size: 1.8rem; margin-bottom: 5px; }
  .leader-rank   { font-size: 0.68rem; font-weight: 700; color: var(--text2); margin-bottom: 4px; letter-spacing: 1px; }
  .leader-name   { font-size: 1.05rem; font-weight: 800; color: var(--text); }
  .leader-stat   { font-size: 0.73rem; color: var(--text2); margin-top: 3px; }
  .leader-team   { font-size: 0.7rem; color: var(--primary); font-weight: 700; margin-top: 2px; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20,40,60,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  .modal {
    background: #fff; border-radius: 18px; padding: 26px 22px;
    width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 24px 64px rgba(20,40,60,0.18);
    transform: translateY(18px); transition: transform 0.22s;
  }
  .modal-overlay.active .modal { transform: translateY(0); }
  .modal h2 { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
  .form-row { margin-bottom: 13px; }
  .form-row label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text2); margin-bottom: 5px; }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
    padding: 9px 12px; font-size: 0.88rem; font-family: 'Pretendard', sans-serif;
    outline: none; transition: border-color 0.18s; background: #F9FBFD; color: var(--text);
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--accent); background: #fff; }
  .form-row input:disabled { background: #EEF2F6; color: #B0BEC5; }
  .radio-group { display: flex; gap: 12px; margin-top: 2px; }
  .radio-label { display: flex; align-items: center; gap: 6px; font-size: 0.84rem; cursor: pointer; color: var(--text); font-weight: 500; }
  .radio-label input[type=radio] { accent-color: var(--primary); width: 15px; height: 15px; }
  .score-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .score-input-item label { color: var(--primary); }
  .absent-check { display: flex; align-items: center; gap: 6px; margin-top: 5px; cursor: pointer; font-size: 0.78rem; color: var(--text2); }
  .absent-check input[type=checkbox] { accent-color: var(--primary); width: 14px; height: 14px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .divider { border: none; border-top: 1.5px dashed var(--border); margin: 14px 0; }

  /* 설정 모달 멤버 행 */
  .member-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .member-row label { font-size: 0.76rem; color: var(--text2); min-width: 36px; font-weight: 600; }
  .member-row input {
    flex: 1; border: none; border-bottom: 1px solid #D0E0EC;
    border-radius: 0; background: transparent;
    padding: 6px 4px; font-size: 0.88rem;
    font-family: 'Pretendard', sans-serif; outline: none;
    color: var(--text); transition: border-color 0.18s;
  }
  .member-row input:focus { border-bottom: 1.5px solid #5BA4CF; }
  .btn-del-member {
    width: 24px; height: 24px; border-radius: 50%;
    background: #E8F0F8; color: #2C5F8A;
    border: none; cursor: pointer; font-size: 0.85rem;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.18s; font-weight: 700; line-height: 1;
  }
  .btn-del-member:hover { background: #FF6B6B; color: #fff; }
  .add-member-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .add-member-row input { flex: 1; border: 1.5px dashed var(--accent); border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; font-family: 'Pretendard', sans-serif; outline: none; background: #F0F7FD; color: var(--text); }
  .add-member-row input:focus { border-style: solid; border-color: var(--primary); background: #fff; }

  /* ── AUTH ── */
  .auth-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #2C5F8A, #5BA4CF); padding: 20px;
  }
  .auth-card {
    background: #fff; border-radius: 20px; box-shadow: 0 24px 64px rgba(20,40,60,0.25);
    padding: 34px 30px; width: 100%; max-width: 380px; text-align: center;
  }
  .auth-title { font-size: 1.25rem; font-weight: 800; color: var(--primary); margin-top: 10px; }
  .auth-sub { font-size: 0.78rem; color: var(--text2); margin-bottom: 22px; }
  .auth-card .form-row { text-align: left; }
  .auth-error { color: #E05555; font-size: 0.78rem; min-height: 16px; margin: 2px 0 12px; text-align: left; font-weight: 600; }
  .auth-switch { margin-top: 16px; font-size: 0.8rem; color: var(--text2); }
  .auth-switch a { color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: none; }
  .auth-switch a:hover { text-decoration: underline; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(70px);
    background: #1E2D3D; color: #fff; padding: 11px 22px; border-radius: 30px;
    font-size: 0.84rem; font-weight: 600; z-index: 9999;
    transition: transform 0.28s ease; pointer-events: none; white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { background: var(--mint); }
  #toast.error   { background: #E05555; }

  /* ── LOADING ── */
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(244,247,251,0.92);
    display: flex; align-items: center; justify-content: center; z-index: 500; transition: opacity 0.3s;
  }
  .spinner { width: 42px; height: 42px; border: 4px solid var(--light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-row td { color: #B0BEC5; font-style: italic; padding: 22px; font-size: 0.84rem; }
  .badge-cnt { display: inline-block; background: var(--light); color: var(--primary); border-radius: 20px; padding: 1px 9px; font-size: 0.7rem; font-weight: 700; margin-left: 6px; }

  @media (max-width: 600px) {
    .title-main { font-size: 1.3rem; }
    .leader-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card-header { flex-direction: column; align-items: flex-start; }
    .modal { padding: 18px 14px; }
    .score-inputs { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 380px) { .leader-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div style="text-align:center">
    <div class="spinner"></div>
    <p style="margin-top:12px;color:var(--primary);font-weight:700;font-size:0.88rem">데이터 불러오는 중...</p>
  </div>
</div>

<!-- 로그인/회원가입 화면 -->
<div class="auth-screen" id="authScreen" style="display:none">
  <div class="auth-card">
    <svg width="52" height="52" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="margin:0 auto;display:block">
      <rect x="4" y="68" width="72" height="8" rx="4" fill="#4CAF50"/>
      <path d="M10 68 Q12 63 14 68M20 68 Q22 62 24 68M35 68 Q37 61 39 68M50 68 Q52 63 54 68M63 68 Q65 64 67 68" stroke="#66BB6A" fill="none" stroke-width="1.5"/>
      <circle cx="40" cy="65" r="6" fill="white" stroke="#ddd" stroke-width="1"/>
      <path d="M40 32 C40 32 30 25 30 19 C30 15 34 12 37 14 C38.5 15 40 17 40 17 C40 17 41.5 15 43 14 C46 12 50 15 50 19 C50 25 40 32 40 32Z" fill="#2C5F8A"/>
    </svg>
    <div class="auth-title">오!오키은 GOLF 2026</div>
    <div class="auth-sub">⛳ 시즌 리더보드</div>

    <div id="loginForm">
      <div class="form-row">
        <label>이메일</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" onkeydown="if(event.key==='Enter')document.getElementById('loginPassword').focus()">
      </div>
      <div class="form-row">
        <label>비밀번호</label>
        <input type="password" id="loginPassword" placeholder="비밀번호" onkeydown="if(event.key==='Enter')handleLogin()">
      </div>
      <div class="auth-error" id="loginError"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="handleLogin()">로그인</button>
      <div class="auth-switch">계정이 없으신가요? <a onclick="showSignup()">회원가입</a></div>
    </div>

    <div id="signupForm" style="display:none">
      <div class="form-row">
        <label>이메일</label>
        <input type="email" id="signupEmail" placeholder="you@example.com">
      </div>
      <div class="form-row">
        <label>비밀번호 (6자리 이상)</label>
        <input type="password" id="signupPassword" placeholder="비밀번호">
      </div>
      <div class="form-row">
        <label>비밀번호 확인</label>
        <input type="password" id="signupPasswordConfirm" placeholder="비밀번호 확인" onkeydown="if(event.key==='Enter')handleSignup()">
      </div>
      <div class="auth-error" id="signupError"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="handleSignup()">회원가입</button>
      <div class="auth-switch">이미 계정이 있으신가요? <a onclick="showLogin()">로그인</a></div>
    </div>
  </div>
</div>

<div id="appContainer" style="display:none">
<header>
  <div class="header-inner">
    <div class="header-left">
      <!-- SVG 로고 -->
      <svg width="56" height="56" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <rect x="4" y="68" width="72" height="8" rx="4" fill="#4CAF50"/>
        <path d="M10 68 Q12 63 14 68M20 68 Q22 62 24 68M35 68 Q37 61 39 68M50 68 Q52 63 54 68M63 68 Q65 64 67 68" stroke="#66BB6A" fill="none" stroke-width="1.5"/>
        <circle cx="40" cy="65" r="6" fill="white" stroke="#ddd" stroke-width="1"/>
        <path d="M40 32 C40 32 30 25 30 19 C30 15 34 12 37 14 C38.5 15 40 17 40 17 C40 17 41.5 15 43 14 C46 12 50 15 50 19 C50 25 40 32 40 32Z" fill="rgba(255,255,255,0.9)"/>
        <circle cx="29" cy="18" r="6" fill="#FFCC80"/>
        <path d="M23 16 Q26 10 29 12 Q32 10 35 16" fill="#795548"/>
        <circle cx="27" cy="17" r="1" fill="#795548"/><circle cx="31" cy="17" r="1" fill="#795548"/>
        <path d="M27 20 Q29 22 31 20" stroke="#E91E63" fill="none" stroke-width="1.2"/>
        <path d="M24 24 L29 22 L34 24 L36 38 L29 40 L22 38Z" fill="rgba(255,255,255,0.85)"/>
        <path d="M22 33 L18 48 L29 46 L40 48 L36 33Z" fill="rgba(255,255,255,0.7)"/>
        <path d="M34 27 Q37 28 40 30" stroke="#FFCC80" fill="none" stroke-width="3" stroke-linecap="round"/>
        <circle cx="51" cy="18" r="6" fill="#FFCC80"/>
        <path d="M45 15 Q51 10 57 15" fill="#4E342E"/>
        <circle cx="49" cy="17" r="1" fill="#4E342E"/><circle cx="53" cy="17" r="1" fill="#4E342E"/>
        <path d="M49 20 Q51 22 53 20" stroke="#E91E63" fill="none" stroke-width="1.2"/>
        <path d="M46 24 L51 22 L56 24 L57 40 L51 42 L45 40Z" fill="rgba(255,255,255,0.85)"/>
        <path d="M50 24 L51 22 L52 24 L51 36Z" fill="rgba(255,255,255,0.5)"/>
        <path d="M46 27 Q43 28 40 30" stroke="#FFCC80" fill="none" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <div>
        <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
          <div class="title-main">오!오키은 GOLF 2026</div>
          <div class="title-slogan">健康！幸福！</div>
        </div>
        <div class="title-sub">⛳ 시즌 리더보드 · 행복한 골프 가족</div>
      </div>
    </div>
    <div class="header-right">
      <div class="header-motto">
        成功，成功，大成功
        <!-- 두 손 펼침 SVG (10손가락) -->
        <svg width="52" height="32" viewBox="0 0 52 32" xmlns="http://www.w3.org/2000/svg">
          <!-- 왼손 (손바닥 앞) -->
          <g fill="#FFDBA4">
            <!-- 손바닥 -->
            <rect x="2" y="18" width="17" height="11" rx="3"/>
            <!-- 새끼손가락 -->
            <rect x="2.5" y="11" width="3.5" height="9" rx="1.8"/>
            <!-- 약지 -->
            <rect x="7" y="7" width="3.5" height="13" rx="1.8"/>
            <!-- 중지 -->
            <rect x="11.5" y="5" width="3.5" height="15" rx="1.8"/>
            <!-- 검지 -->
            <rect x="16" y="7" width="3.5" height="13" rx="1.8"/>
            <!-- 엄지 (비스듬) -->

// 인증 (golf_users 테이블 직접 구현)
// ═══════════════════════════════════════════
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function showLogin() {
  document.getElementById('loginForm').style.display = '';
  document.getElementById('signupForm').style.display = 'none';
  document.getElementById('loginError').textContent = '';
}
function showSignup() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('signupForm').style.display = '';
  document.getElementById('signupError').textContent = '';
}

async function handleLogin() {
  const email    = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;
  const errEl    = document.getElementById('loginError');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = '이메일과 비밀번호를 입력해주세요'; return; }
  if (!sb) { errEl.textContent = 'DB 연결 오류입니다'; return; }

  const hash = await sha256(password);
  const { data, error } = await sb.from('golf_users').select('id,email,password_hash,is_admin').eq('email', email).maybeSingle();
  if (error || !data || data.password_hash !== hash) {
    errEl.textContent = '이메일 또는 비밀번호가 올바르지 않습니다';
    return;
  }
  localStorage.setItem('golf_email', email);
  localStorage.setItem('golf_session', email);
  localStorage.setItem('golf_is_admin', data.is_admin ? '1' : '0');
  enterApp();
}

async function handleSignup() {
  const email    = document.getElementById('signupEmail').value.trim().toLowerCase();
  const password = document.getElementById('signupPassword').value;
  const confirm  = document.getElementById('signupPasswordConfirm').value;
  const errEl    = document.getElementById('signupError');
  errEl.textContent = '';
  if (!email || !password || !confirm) { errEl.textContent = '모든 항목을 입력해주세요'; return; }
  if (password.length < 6) { errEl.textContent = '비밀번호는 6자리 이상이어야 합니다'; return; }
  if (password !== confirm) { errEl.textContent = '비밀번호가 일치하지 않습니다'; return; }
  if (!sb) { errEl.textContent = 'DB 연결 오류입니다'; return; }

  const { data: existing } = await sb.from('golf_users').select('id').eq('email', email).maybeSingle();
  if (existing) { errEl.textContent = '이미 가입된 이메일입니다'; return; }

  const hash = await sha256(password);
  const { error } = await sb.from('golf_users').insert([{ email, password_hash: hash }]);
  if (error) { errEl.textContent = '가입 실패: ' + error.message; return; }

  localStorage.setItem('golf_email', email);
  localStorage.setItem('golf_session', email);
  localStorage.setItem('golf_is_admin', '0');
  enterApp();
}

function handleLogout() {
  localStorage.removeItem('golf_session');
  localStorage.removeItem('golf_is_admin');
  document.getElementById('appContainer').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
  showLogin();
  document.getElementById('loginEmail').value = localStorage.getItem('golf_email') || '';
  document.getElementById('loginPassword').value = '';
}

function isAdmin() { return localStorage.getItem('golf_is_admin') === '1'; }

function enterApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = '';
  document.getElementById('settingsBtn').style.display = isAdmin() ? '' : 'none';
  init();
}

async function checkSession() {
  const savedEmail = localStorage.getItem('golf_email');
  if (savedEmail) document.getElementById('loginEmail').value = savedEmail;
  const session = localStorage.getItem('golf_session');
  if (session) {
    if (localStorage.getItem('golf_is_admin') === null && sb) {
      const { data } = await sb.from('golf_users').select('is_admin').eq('email', session).maybeSingle();
      localStorage.setItem('golf_is_admin', data?.is_admin ? '1' : '0');
    }
    enterApp();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appContainer').style.display = 'none';
    hideLoading();
  }
}

// ═══════════════════════════════════════════
// 초기화
// ═══════════════════════════════════════════
async function init() {
  if (!sb) {
    useLocal = true;
    state = JSON.parse(JSON.stringify(DEFAULTS));
    hideLoading(); render();
    showToast('로컬 모드 (DB 미연결)', 'error');
    return;
  }
  try {
    const [t, m, r, s] = await Promise.all([
      sb.from('teams').select('*').order('display_order'),
      sb.from('members').select('*').order('display_order'),
      sb.from('rounds').select('*').order('round_date'),
      sb.from('scores').select('*')
    ]);
    if (t.error) throw t.error;
    state.teams   = (t.data || []).map(fromDB.team);
    state.members = (m.data || []).map(fromDB.member);
    state.rounds  = (r.data || []).map(fromDB.round);
    state.scores  = (s.data || []).map(fromDB.score);
    hideLoading(); render();
  } catch(e) {
    console.error(e);
    useLocal = true;
    state = JSON.parse(JSON.stringify(DEFAULTS));
    hideLoading(); render();
    showToast('DB 오류: ' + e.message, 'error');
  }
}

// ═══════════════════════════════════════════
// 렌더링
// ═══════════════════════════════════════════
function render() { renderTeams(); renderLeader(); }

function renderTeams() {
  const c = document.getElementById('teamsContainer');
  c.innerHTML = '';
  for (const team of state.teams) c.appendChild(buildTeamCard(team));
}

function buildTeamCard(team) {
  const members = state.members.filter(m => m.team_id === team.id).sort((a,b) => a.order - b.order);
  const rounds  = state.rounds.filter(r => r.team_id === team.id).sort((a,b) => {
    if (a.date && b.date) return new Date(a.date) - new Date(b.date);
    return parseInt(a.month) - parseInt(b.month);
  });
  const card = document.createElement('div');
  card.className = 'team-card';
  card.innerHTML = `
    <div class="card-header">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="card-title">${team.order===1?'🌸':'⛳'} ${team.name}<span class="badge-cnt">${members.length}명</span></div>
        ${isAdmin() ? '<span class="card-hint">💡 셀을 더블클릭하면 바로 수정 가능</span>' : ''}
      </div>
      ${isAdmin() ? `<button class="btn btn-accent btn-sm" onclick="openRoundModal(${team.id})">+ 라운드 추가</button>` : ''}
    </div>
    <div class="table-wrap">${buildTable(team, members, rounds)}</div>`;
  return card;
}

function buildTable(team, members, rounds) {
  if (!members.length) return '<p style="padding:20px;color:#B0BEC5">멤버 없음</p>';

  let thead = `<tr><th>월</th>`;
  for (const m of members) thead += `<th>${m.name}</th>`;
  thead += `<th>비고</th><th></th></tr>`;

  let tbody = '';
  if (!rounds.length) {
    tbody = `<tr class="empty-row"><td colspan="${members.length+3}">아직 라운드 기록이 없습니다 ✨</td></tr>`;
  } else {
    for (const round of rounds) {
      const scoreMap = {};
      state.scores.filter(s => s.round_id === round.id).forEach(s => scoreMap[s.member_id] = s);

      let rank1 = null, rank2 = null;
      if (round.is_official) {
        const valid = members.map(m => ({ id: m.id, score: scoreMap[m.id]?.score }))
          .filter(x => x.score != null).sort((a,b) => a.score - b.score);
        rank1 = valid[0]?.score;
        rank2 = valid.filter(x => x.score !== rank1)[0]?.score;
      }

      let row = `<tr>`;
      const officialBadge = round.is_official
        ? `<span class="badge-official" onclick="toggleOfficial(${round.id});event.stopPropagation()" title="클릭해서 비공식으로 변경">공식</span>`
        : `<span class="badge-unofficial" onclick="toggleOfficial(${round.id});event.stopPropagation()" title="클릭해서 공식으로 변경">비공식</span>`;
      row += `<td class="month-cell editable" ondblclick="editCell(this,'month',${round.id})">${round.month}${officialBadge}</td>`;

      for (const m of members) {
        const sc = scoreMap[m.id];
        const absent = !sc || sc.absent;
        const score = sc?.score;
        let cls = isAdmin() ? 'editable' : '';
        let display = absent ? '<span class="score-absent">·</span>' : (score ?? '-');
        if (score != null && !absent && round.is_official) {
          if (score === rank1) cls += ' score-gold';
          else if (score === rank2) cls += ' score-silver';
        }
        const scoreDbl = isAdmin() ? `ondblclick="editCell(this,'score',${round.id},${m.id})"` : '';
        row += `<td class="${cls}" ${scoreDbl}>${display}</td>`;
      }
      const noteCls = isAdmin() ? 'note-cell editable' : 'note-cell';
      const noteDbl = isAdmin() ? `ondblclick="editCell(this,'note',${round.id})"` : '';
      row += `<td class="${noteCls}" ${noteDbl}>${round.note || '<span style="color:#D6E4F0">-</span>'}</td>`;
      row += `<td class="del-cell">${isAdmin() ? `<button class="del-btn" onclick="deleteRound(${round.id})" title="삭제">✕</button>` : ''}</td>`;
      row += `</tr>`;
      tbody += row;
    }
  }

  // 공식 라운드만으로 집계
  const officialRounds = rounds.filter(r => r.is_official);
  const t1 = computeTally(members, officialRounds, 1);
  const t2 = computeTally(members, officialRounds, 2);

  let tally1 = `<tr class="tally-row"><td class="tally-label">🥇 1위 횟수</td>`;
  let tally2 = `<tr class="tally-row"><td class="tally-label">🥈 2위 횟수</td>`;
  for (const m of members) {
    tally1 += `<td>${t1[m.id] || 0}</td>`;
    tally2 += `<td>${t2[m.id] || 0}</td>`;
  }
  tally1 += `<td></td><td></td></tr>`;
  tally2 += `<td></td><td></td></tr>`;

  return `<table><thead>${thead}</thead><tbody>${tbody}${tally1}${tally2}</tbody></table>`;
}

function computeTally(members, rounds, rank) {
  const tally = {};
  for (const round of rounds) {
    const scoreMap = {};
    state.scores.filter(s => s.round_id === round.id).forEach(s => scoreMap[s.member_id] = s);
    const valid = members.map(m => ({ id: m.id, score: scoreMap[m.id]?.score }))
      .filter(x => x.score != null).sort((a,b) => a.score - b.score);
    if (rank === 1 && valid[0]) {
      const best = valid[0].score;
      valid.filter(x => x.score === best).forEach(x => { tally[x.id] = (tally[x.id]||0) + 1; });
    } else if (rank === 2 && valid.length >= 2) {
      const best = valid[0].score;
      const second = valid.filter(x => x.score !== best)[0]?.score;
      if (second != null) valid.filter(x => x.score === second).forEach(x => { tally[x.id] = (tally[x.id]||0) + 1; });
    }
  }
  return tally;
}

function renderLeader() {
  const stats = [];
  for (const m of state.members) {
    const team = state.teams.find(t => t.id === m.team_id);
    const teamRounds  = state.rounds.filter(r => r.team_id === m.team_id && r.is_official);
    const teamMembers = state.members.filter(x => x.team_id === m.team_id);
    const t1 = computeTally(teamMembers, teamRounds, 1);
    const t2 = computeTally(teamMembers, teamRounds, 2);
    stats.push({ name: m.name, team: team?.name, wins: t1[m.id]||0, seconds: t2[m.id]||0 });
  }
  stats.sort((a,b) => b.wins - a.wins || b.seconds - a.seconds);
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  if (stats[0]) { set('leader1-name', stats[0].name); set('leader1-stat', `🥇 ${stats[0].wins}회 우승`); set('leader1-team', stats[0].team||''); }
  if (stats[1]) { set('leader2-name', stats[1].name); set('leader2-stat', `🥇 ${stats[1].wins}회 우승`); set('leader2-team', stats[1].team||''); }
}

// ═══════════════════════════════════════════
// 인라인 편집
// ═══════════════════════════════════════════
function editCell(td, type, roundId, memberId) {
  if (td.querySelector('input')) return;
  const origHTML = td.innerHTML;
  const currentText = td.innerText.trim();
  const input = document.createElement('input');
  input.className = 'inline-edit';
  if (type === 'score') input.type = 'number';
  input.value = (type === 'score' && (currentText === '-' || currentText === '·' || currentText === '결석')) ? '' : currentText;
  td.innerHTML = ''; td.appendChild(input);
  input.focus(); input.select();

  let saved = false;
  const save = async () => {
    if (saved) return; saved = true;
    const val = input.value.trim();
    if (type === 'score') {
      const absent = val === '';
      const score  = absent ? null : parseInt(val);
      await upsertScore(roundId, memberId, score, absent);
    } else if (type === 'month') {
      await updateRoundField(roundId, 'month', val);
    } else if (type === 'note') {
      await updateRoundField(roundId, 'note', val);
    }
    render();
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') { saved = true; td.innerHTML = origHTML; }
  });
  input.addEventListener('blur', save);
}

async function upsertScore(roundId, memberId, score, absent) {
  const ex = state.scores.find(s => s.round_id === roundId && s.member_id === memberId);
  if (ex) {
    ex.score = score; ex.absent = absent;
    if (sb) await sb.from('scores').update({ strokes: absent ? null : score }).eq('id', ex.id);
  } else {
    const row = { id: nid(), round_id: roundId, member_id: memberId, score, absent };
    state.scores.push(row);
    if (sb) {
      const { data } = await sb.from('scores').insert([{ round_id: roundId, member_id: memberId, strokes: absent ? null : score }]).select();
      if (data?.[0]) row.id = data[0].id;
    }
  }
}

async function updateRoundField(roundId, field, value) {
  const round = state.rounds.find(r => r.id === roundId);
  if (!round) return;
  round[field] = value;
  if (sb) {
    const dbField = field === 'date' ? 'round_date' : (field === 'month' ? 'month' : field);
    const dbVal   = field === 'month' ? parseInt(value) : value;
    await sb.from('rounds').update({ [dbField]: dbVal }).eq('id', roundId);
  }
}

async function toggleOfficial(roundId) {
  const round = state.rounds.find(r => r.id === roundId);
  if (!round) return;
  round.is_official = !round.is_official;
  if (sb) await sb.from('rounds').update({ is_official: round.is_official }).eq('id', roundId);
  render();
  showToast(round.is_official ? '✅ 공식 경기로 변경됨' : '비공식으로 변경됨', 'success');
}

// ═══════════════════════════════════════════
// 라운드 추가
// ═══════════════════════════════════════════
function openRoundModal(teamId) {
  const team    = state.teams.find(t => t.id === teamId);
  const members = state.members.filter(m => m.team_id === teamId).sort((a,b) => a.order - b.order);
  document.getElementById('roundTeamId').value   = teamId;
  document.getElementById('roundTeamName').value = team?.name || '';
  document.getElementById('roundMonth').value    = '';
  document.getElementById('roundDate').value     = '';
  document.getElementById('roundCourse').value   = '';
  document.getElementById('roundNote').value     = '';
  document.querySelector('input[name=isOfficial][value=true]').checked = true;

  const si = document.getElementById('scoreInputs');
  si.innerHTML = '';
  for (const m of members) {
    si.innerHTML += `
      <div class="score-input-item">
        <label>${m.name}</label>
        <input type="number" id="sc_${m.id}" placeholder="타수" min="50" max="200">
        <label class="absent-check">
          <input type="checkbox" id="ab_${m.id}" onchange="toggleAbsent(${m.id})"> 비참석
        </label>
      </div>`;
  }
  openModal('roundModal');
}

function toggleAbsent(mid) {
  const ab  = document.getElementById(`ab_${mid}`).checked;
  const inp = document.getElementById(`sc_${mid}`);
  inp.disabled = ab;
  if (ab) inp.value = '';
}

async function saveRound() {
  const teamId    = parseInt(document.getElementById('roundTeamId').value);
  const month     = document.getElementById('roundMonth').value;
  const date      = document.getElementById('roundDate').value || null;
  const course    = document.getElementById('roundCourse').value.trim();
  const noteTxt   = document.getElementById('roundNote').value.trim();
  const isOfficial= document.querySelector('input[name=isOfficial]:checked').value === 'true';
  const note      = [course, noteTxt].filter(Boolean).join(' / ');

  if (!month) { showToast('월을 선택해주세요', 'error'); return; }

  const appRound = { id: nid(), team_id: teamId, month: month+'월', date, note, is_official: isOfficial };
  if (sb) {
    const { data, error } = await sb.from('rounds')
      .insert([{ team_id: teamId, month: parseInt(month), round_date: date, note, is_official: isOfficial }]).select();
    if (error) { showToast('저장 실패: ' + error.message, 'error'); return; }
    if (data?.[0]) appRound.id = data[0].id;
  }
  state.rounds.push(appRound);

  const members = state.members.filter(m => m.team_id === teamId);
  for (const m of members) {
    const absent = document.getElementById(`ab_${m.id}`)?.checked || false;
    const val    = document.getElementById(`sc_${m.id}`)?.value;
    const score  = absent ? null : (val ? parseInt(val) : null);
    if (score !== null || absent) await upsertScore(appRound.id, m.id, score, absent);
  }

  closeModal('roundModal');
  render();
  showToast('라운드 추가 완료! ⛳', 'success');
}

async function deleteRound(roundId) {
  if (!confirm('이 라운드를 삭제할까요?')) return;
  state.scores = state.scores.filter(s => s.round_id !== roundId);
  state.rounds = state.rounds.filter(r => r.id !== roundId);
  if (sb) {
    await sb.from('scores').delete().eq('round_id', roundId);
    await sb.from('rounds').delete().eq('id', roundId);
  }
  render(); showToast('삭제되었습니다', 'success');
}

// ═══════════════════════════════════════════
// 설정 (멤버 추가/삭제 포함)
// ═══════════════════════════════════════════
function openSettingsModal() {
  renderSettingsContent();
  openModal('settingsModal');
}

function renderSettingsContent() {
  const c = document.getElementById('settingsContent');
  c.innerHTML = '';
  for (const team of state.teams) {
    const members = state.members.filter(m => m.team_id === team.id).sort((a,b) => a.order - b.order);
    const teamBlock = document.createElement('div');
    teamBlock.style.marginBottom = '18px';
    teamBlock.innerHTML = `
      <div style="font-weight:800;color:var(--primary);margin-bottom:10px;font-size:0.9rem">
        ${team.order===1?'🌸':'⛳'} ${team.name}
      </div>
      ${members.map(m => `
        <div class="member-row" id="mrow_${m.id}">
          <label>${m.order}</label>
          <input type="text" id="mn_${m.id}" value="${m.name}">
          <button class="btn-del-member" onclick="deleteMember(${m.id},'${m.name}')" title="멤버 삭제">×</button>
        </div>`).join('')}
      <div class="add-member-row" id="addrow_${team.id}">
        <input type="text" id="newmember_${team.id}" placeholder="+ 멤버 이름 입력">
        <button class="btn btn-accent btn-sm" onclick="addMember(${team.id})">추가</button>
      </div>
      <hr class="divider">`;
    c.appendChild(teamBlock);
  }
}

async function addMember(teamId) {
  const input = document.getElementById(`newmember_${teamId}`);
  const name  = input?.value.trim();
  if (!name) { showToast('이름을 입력해주세요', 'error'); return; }

  const teamMembers = state.members.filter(m => m.team_id === teamId);
  const order = (teamMembers.length > 0 ? Math.max(...teamMembers.map(m => m.order)) : 0) + 1;
  const newM  = { id: nid(), team_id: teamId, name, order };

  if (sb) {
    const { data, error } = await sb.from('members')
      .insert([{ team_id: teamId, name, display_order: order }]).select();
    if (error) { showToast('추가 실패: ' + error.message, 'error'); return; }
    if (data?.[0]) newM.id = data[0].id;
  }
  state.members.push(newM);
  if (input) input.value = '';
  renderSettingsContent();
  showToast(`${name} 추가됨 ✅`, 'success');
}

async function deleteMember(memberId, name) {
  if (!confirm(`'${name}' 멤버를 삭제할까요?\n(해당 멤버의 점수도 모두 삭제됩니다)`)) return;
  state.scores  = state.scores.filter(s => s.member_id !== memberId);
  state.members = state.members.filter(m => m.id !== memberId);
  if (sb) {
    await sb.from('scores').delete().eq('member_id', memberId);
    await sb.from('members').delete().eq('id', memberId);
  }
  renderSettingsContent();
  render();
  showToast(`${name} 삭제됨`, 'success');
}

async function saveSettings() {
  for (const m of state.members) {
    const inp = document.getElementById(`mn_${m.id}`);
    if (!inp) continue;
    const newName = inp.value.trim();
    if (newName && newName !== m.name) {
      m.name = newName;
      if (sb) await sb.from('members').update({ name: newName }).eq('id', m.id);
    }
  }
  closeModal('settingsModal');
  render(); showToast('저장 완료 ✅', 'success');
}

// ═══════════════════════════════════════════
// 유틸
// ═══════════════════════════════════════════
function openModal(id)  { document.getElementById(id).classList.add('active');    document.body.style.overflow='hidden'; }
function closeModal(id) { document.getElementById(id).classList.remove('active'); document.body.style.overflow=''; }
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target===el) closeModal(el.id); });
});
function hideLoading() {
  const el = document.getElementById('loadingOverlay');
  if (el) { el.style.opacity='0'; setTimeout(()=>el.remove(),300); }
}
let toastTimer;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = type ? `show ${type}` : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className=''; }, 3200);
}

checkSession();
</script>
</body>
</html>
