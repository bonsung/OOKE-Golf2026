<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오!오키은 GOLF 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #FFF9F5;
    --primary: #FF6B35;
    --secondary: #FFD166;
    --mint: #06D6A0;
    --gold: #FFD700;
    --silver: #C0C0C0;
    --text: #333;
    --card-bg: #fff;
    --border: #f0e0d0;
    --shadow: 0 4px 20px rgba(255,107,53,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #FF6B35 0%, #ff8c5a 50%, #FFD166 100%);
    padding: 24px 20px 20px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(255,107,53,0.3);
  }
  .header-inner { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .logo-wrap { flex-shrink: 0; }
  .title-block { text-align: left; }
  .title-main {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    line-height: 1.1;
  }
  .title-sub {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.85);
    margin-top: 4px;
    font-weight: 500;
  }

  /* ── MAIN ── */
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

  /* ── CARD ── */
  .team-card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    background: linear-gradient(90deg, #fff5f0, #fff9f5);
    border-bottom: 2px solid var(--border);
    flex-wrap: wrap; gap: 8px;
  }
  .card-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: var(--primary);
    display: flex; align-items: center; gap: 8px;
  }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── BUTTONS ── */
  .btn {
    border: none; border-radius: 10px; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; font-size: 0.8rem; font-weight: 700;
    padding: 8px 14px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #e85d2a; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,107,53,0.35); }
  .btn-outline { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
  .btn-outline:hover { background: #fff5f0; }
  .btn-mint { background: var(--mint); color: #fff; }
  .btn-mint:hover { background: #05bc8e; transform: translateY(-1px); }
  .btn-danger { background: #ff4757; color: #fff; }
  .btn-danger:hover { background: #e63946; }
  .btn-sm { padding: 4px 10px; font-size: 0.75rem; }

  /* ── TABLE ── */
  .table-wrap { overflow-x: auto; padding: 0 0 4px; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th {
    background: linear-gradient(135deg, var(--primary), #ff8c5a);
    color: #fff; font-size: 0.8rem; font-weight: 700;
    padding: 10px 10px; text-align: center; white-space: nowrap;
  }
  th:first-child { border-radius: 0; }
  td {
    padding: 9px 10px; text-align: center; font-size: 0.85rem;
    border-bottom: 1px solid #f5ece4;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fffaf7; }
  .rank1-row td { background: rgba(255,215,0,0.08); font-weight: 700; }
  .rank2-row td { background: rgba(192,192,192,0.08); }

  /* 셀 색상 */
  .score-gold { color: #c8860a; font-weight: 700; }
  .score-silver { color: #888; font-weight: 700; }
  .score-absent { color: #ccc; font-style: italic; font-size: 0.75rem; }

  /* 집계 행 */
  .tally-row td {
    background: linear-gradient(90deg, #fffbf0, #fff9f5);
    font-weight: 700; font-size: 0.82rem;
    border-top: 2px solid var(--secondary);
  }
  .tally-label { font-size: 0.78rem; color: #888; text-align: left; padding-left: 12px; }

  /* 인라인 편집 */
  .editable { cursor: pointer; }
  .editable:hover { background: #fff3ee; border-radius: 4px; }
  input.inline-edit {
    width: 100%; border: 2px solid var(--primary); border-radius: 6px;
    padding: 3px 6px; font-size: 0.85rem; text-align: center;
    font-family: 'Noto Sans KR', sans-serif; outline: none;
    background: #fff8f5;
  }

  /* 월/비고 셀 */
  .month-cell { font-weight: 700; color: var(--primary); white-space: nowrap; font-size: 0.82rem; }
  .note-cell { font-size: 0.78rem; color: #999; min-width: 80px; }

  /* 삭제 버튼 셀 */
  .del-cell { width: 32px; }
  .del-btn { background: none; border: none; cursor: pointer; color: #ffb3a0; font-size: 1rem; padding: 2px; line-height: 1; }
  .del-btn:hover { color: #ff4757; }

  /* ── LEADER SECTION ── */
  .leader-section {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 24px 20px;
    border: 1px solid var(--border);
    margin-top: 8px;
  }
  .leader-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
    color: var(--primary);
    text-align: center;
    margin-bottom: 20px;
  }
  .leader-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .leader-card {
    border-radius: 14px; padding: 18px 16px; text-align: center;
    border: 2px solid transparent;
  }
  .leader-card.gold-card {
    background: linear-gradient(135deg, #fffbe6, #fff8d0);
    border-color: var(--gold);
  }
  .leader-card.silver-card {
    background: linear-gradient(135deg, #f8f8f8, #f0f0f0);
    border-color: var(--silver);
  }
  .leader-medal { font-size: 2rem; margin-bottom: 6px; }
  .leader-rank { font-size: 0.7rem; font-weight: 700; color: #888; margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
  .leader-name { font-size: 1.1rem; font-weight: 700; color: var(--text); }
  .leader-stat { font-size: 0.75rem; color: #999; margin-top: 4px; }
  .leader-team { font-size: 0.72rem; color: var(--primary); font-weight: 700; margin-top: 2px; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  .modal {
    background: #fff; border-radius: 20px; padding: 28px 24px;
    width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    transform: translateY(20px); transition: transform 0.2s;
  }
  .modal-overlay.active .modal { transform: translateY(0); }
  .modal h2 {
    font-family: 'Fredoka One', cursive;
    color: var(--primary); font-size: 1.3rem; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 0.8rem; font-weight: 700; color: #666; margin-bottom: 5px; }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%; border: 2px solid #f0e0d0; border-radius: 10px;
    padding: 9px 12px; font-size: 0.9rem; font-family: 'Noto Sans KR', sans-serif;
    outline: none; transition: border-color 0.2s; background: #fffaf7;
  }
  .form-row input:focus, .form-row select:focus { border-color: var(--primary); }
  .score-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .score-input-item label { color: var(--primary); }
  .absent-check { display: flex; align-items: center; gap: 6px; margin-top: 6px; cursor: pointer; font-size: 0.82rem; color: #888; }
  .absent-check input[type=checkbox] { accent-color: var(--primary); width: 15px; height: 15px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #333; color: #fff; padding: 11px 22px; border-radius: 30px;
    font-size: 0.85rem; font-weight: 500; z-index: 9999;
    transition: transform 0.3s ease; pointer-events: none; white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { background: var(--mint); }
  #toast.error { background: #ff4757; }

  /* ── LOADING ── */
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(255,249,245,0.85);
    display: flex; align-items: center; justify-content: center; z-index: 500;
  }
  .spinner {
    width: 44px; height: 44px; border: 4px solid #ffd166;
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .title-main { font-size: 1.5rem; }
    .leader-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .leader-card { padding: 14px 10px; }
    .leader-name { font-size: 0.95rem; }
    .card-header { flex-direction: column; align-items: flex-start; }
    .modal { padding: 20px 16px; }
    .score-inputs { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 380px) {
    .leader-grid { grid-template-columns: 1fr; }
  }

  .empty-row td { color: #ccc; font-style: italic; padding: 20px; text-align: center; }
  .badge {
    display: inline-block; background: var(--secondary);
    color: #c8860a; border-radius: 20px; padding: 2px 10px;
    font-size: 0.72rem; font-weight: 700; margin-left: 6px;
  }
  .settings-member-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .settings-member-row label { font-size: 0.78rem; color: #888; min-width: 40px; }
  .settings-member-row input { flex: 1; }
  .divider { border: none; border-top: 2px dashed #f0e0d0; margin: 16px 0; }
</style>
</head>

// ═══════════════════════════════════════════
// SUPABASE 초기화

// ═══════════════════════════════════════════
// 앱 상태
// ═══════════════════════════════════════════

// 기본 데이터 (DB 연결 실패 시 사용)

let useLocalData = false;
let nextId = { teams: 10, members: 20, rounds: 10, scores: 50 };

// ═══════════════════════════════════════════
// 초기화
// ═══════════════════════════════════════════
async function init() {
  if (!sb || SUPABASE_URL.includes('__')) {
    console.warn('Supabase 미연결 → 로컬 데이터 사용');
    useLocalData = true;
    state = JSON.parse(JSON.stringify(DEFAULT_DATA));
    hideLoading();
    render();
    return;
  }
  try {
    await loadFromSupabase();
    hideLoading();
    render();
  } catch(e) {
    console.error('Supabase 오류:', e);
    useLocalData = true;
    state = JSON.parse(JSON.stringify(DEFAULT_DATA));
    hideLoading();
    render();
    showToast('DB 연결 실패 → 로컬 데이터로 표시합니다', 'error');
  }
}

async function loadFromSupabase() {
  const [t, m, r, s] = await Promise.all([
    sb.from('teams').select('*').order('order'),
    sb.from('members').select('*').order('order'),
    sb.from('rounds').select('*').order('date'),
    sb.from('scores').select('*')
  ]);
  if (t.error) throw t.error;
  // 데이터가 없으면 기본 데이터 삽입
  if (!t.data || t.data.length === 0) {
    await seedSupabase();
    return loadFromSupabase();
  }
  state.teams = t.data;
  state.members = m.data || [];
  state.rounds = r.data || [];
  state.scores = s.data || [];
}

async function seedSupabase() {
  await sb.from('teams').insert(DEFAULT_DATA.teams);
  await sb.from('members').insert(DEFAULT_DATA.members);
  await sb.from('rounds').insert(DEFAULT_DATA.rounds);
  await sb.from('scores').insert(DEFAULT_DATA.scores);
}

// ═══════════════════════════════════════════
// 렌더링
// ═══════════════════════════════════════════
function render() {
  renderTeams();
  renderLeader();
}

function renderTeams() {
  const container = document.getElementById('teamsContainer');
  container.innerHTML = '';
  for (const team of state.teams) {
    container.appendChild(buildTeamCard(team));
  }
}

function buildTeamCard(team) {
  const members = state.members.filter(m => m.team_id === team.id).sort((a,b) => a.order - b.order);
  const rounds = state.rounds.filter(r => r.team_id === team.id).sort((a,b) => {
    const mo = m => parseInt(m.month);
    if (a.date && b.date) return new Date(a.date) - new Date(b.date);
    return mo(a.month) - mo(b.month);
  });

  const card = document.createElement('div');
  card.className = 'team-card';
  card.innerHTML = `
    <div class="card-header">
      <div class="card-title">
        ${team.order === 1 ? '🌸' : '⛳'} ${team.name}
        <span class="badge">${members.length}명</span>
      </div>
      <div class="card-actions">
        <button class="btn btn-mint" onclick="openRoundModal(${team.id})">+ 라운드 추가</button>
      </div>
    </div>
    <div class="table-wrap">
      ${buildTable(team, members, rounds)}
    </div>
  `;
  return card;
}

function buildTable(team, members, rounds) {
  if (!members.length) return '<p style="padding:20px;color:#ccc">멤버가 없습니다</p>';

  // 컬럼 헤더
  let thead = `<tr><th>월</th>`;
  for (const m of members) thead += `<th>${m.name}</th>`;
  thead += `<th>비고</th><th></th></tr>`;

  // 데이터 행
  let tbody = '';
  if (!rounds.length) {
    tbody = `<tr class="empty-row"><td colspan="${members.length + 3}">아직 라운드 기록이 없습니다 ✨</td></tr>`;
  } else {
    for (const round of rounds) {
      const scores = state.scores.filter(s => s.round_id === round.id);
      const scoreMap = {};
      for (const s of scores) scoreMap[s.member_id] = s;

      // 이번 라운드 유효 점수들로 순위 계산
      const validScores = members
        .map(m => ({ memberId: m.id, score: scoreMap[m.id]?.score }))
        .filter(x => x.score != null)
        .sort((a, b) => a.score - b.score);

      const rank1Score = validScores[0]?.score;
      const rank2Score = validScores[1]?.score;

      let row = `<tr>`;
      row += `<td class="month-cell editable" ondblclick="editCell(this,'month','${round.id}')">${round.month || '-'}</td>`;

      for (const m of members) {
        const sc = scoreMap[m.id];
        const absent = sc?.absent;
        const score = sc?.score;
        let cls = 'editable';
        let display = absent ? '<span class="score-absent">결석</span>' : (score ?? '-');
        if (score != null && !absent) {
          if (score === rank1Score) cls += ' score-gold';
          else if (score === rank2Score) cls += ' score-silver';
        }
        row += `<td class="${cls}" ondblclick="editCell(this,'score','${round.id}','${m.id}')">${display}</td>`;
      }

      const note = round.note || '';
      row += `<td class="note-cell editable" ondblclick="editCell(this,'note','${round.id}')">${note || '<span style="color:#eee">-</span>'}</td>`;
      row += `<td class="del-cell"><button class="del-btn" onclick="deleteRound(${round.id})" title="삭제">✕</button></td>`;
      row += `</tr>`;
      tbody += row;
    }
  }

  // 집계 행: 1위 횟수
  const tally1 = computeTally(members, rounds, 1);
  let tally1Row = `<tr class="tally-row"><td class="tally-label">🥇 1위 횟수</td>`;
  for (const m of members) tally1Row += `<td>${tally1[m.id] || 0}</td>`;
  tally1Row += `<td></td><td></td></tr>`;

  // 집계 행: 2위 횟수
  const tally2 = computeTally(members, rounds, 2);
  let tally2Row = `<tr class="tally-row"><td class="tally-label">🥈 2위 횟수</td>`;
  for (const m of members) tally2Row += `<td>${tally2[m.id] || 0}</td>`;
  tally2Row += `<td></td><td></td></tr>`;

  return `<table><thead>${thead}</thead><tbody>${tbody}${tally1Row}${tally2Row}</tbody></table>`;
}

function computeTally(members, rounds, rank) {
  const tally = {};
  for (const round of rounds) {
    const scores = state.scores.filter(s => s.round_id === round.id);
    const scoreMap = {};
    for (const s of scores) scoreMap[s.member_id] = s;
    const valid = members
      .map(m => ({ id: m.id, score: scoreMap[m.id]?.score }))
      .filter(x => x.score != null)
      .sort((a, b) => a.score - b.score);
    if (rank === 1 && valid[0]) {
      const best = valid[0].score;
      valid.filter(x => x.score === best).forEach(x => { tally[x.id] = (tally[x.id] || 0) + 1; });
    } else if (rank === 2 && valid[1]) {
      const best = valid[0]?.score;
      const second = valid.filter(x => x.score !== best)[0]?.score;
      if (second != null) valid.filter(x => x.score === second).forEach(x => { tally[x.id] = (tally[x.id] || 0) + 1; });
    }
  }
  return tally;
}

function renderLeader() {
  // 전체 멤버 1위 횟수 집계
  const allMemberStats = [];
  for (const m of state.members) {
    const team = state.teams.find(t => t.id === m.team_id);
    const teamRounds = state.rounds.filter(r => r.team_id === m.team_id);
    const teamMembers = state.members.filter(tm => tm.team_id === m.team_id);
    const tally1 = computeTally(teamMembers, teamRounds, 1);
    const tally2 = computeTally(teamMembers, teamRounds, 2);
    allMemberStats.push({
      name: m.name, teamName: team?.name,
      wins: tally1[m.id] || 0,
      seconds: tally2[m.id] || 0
    });
  }
  allMemberStats.sort((a, b) => b.wins - a.wins || b.seconds - a.seconds);

  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  if (allMemberStats[0]) {
    set('leader1-name', allMemberStats[0].name);
    set('leader1-stat', `🥇 ${allMemberStats[0].wins}회 우승`);
    set('leader1-team', allMemberStats[0].teamName);
  }
  if (allMemberStats[1]) {
    set('leader2-name', allMemberStats[1].name);
    set('leader2-stat', `🥇 ${allMemberStats[1].wins}회 우승`);
    set('leader2-team', allMemberStats[1].teamName);
  }
}

// ═══════════════════════════════════════════
// 인라인 편집
// ═══════════════════════════════════════════
function editCell(td, type, roundId, memberId) {
  if (td.querySelector('input')) return;
  const currentText = td.innerText.trim();
  const origHTML = td.innerHTML;

  const input = document.createElement('input');
  input.className = 'inline-edit';
  if (type === 'score') input.type = 'number';
  input.value = (type === 'score' && (currentText === '-' || currentText === '결석')) ? '' : currentText;
  td.innerHTML = '';
  td.appendChild(input);
  input.focus(); input.select();

  const save = async () => {
    const val = input.value.trim();
    if (type === 'score') {
      const score = val === '' ? null : parseInt(val);
      await upsertScore(parseInt(roundId), parseInt(memberId), score, false);
    } else if (type === 'month') {
      await updateRoundField(parseInt(roundId), 'month', val || origHTML);
    } else if (type === 'note') {
      await updateRoundField(parseInt(roundId), 'note', val);
    }
    render();
  };
  const cancel = () => { td.innerHTML = origHTML; };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') cancel();
  });
  input.addEventListener('blur', save);
}

async function upsertScore(roundId, memberId, score, absent) {
  const existing = state.scores.find(s => s.round_id === roundId && s.member_id === memberId);
  if (existing) {
    existing.score = score; existing.absent = absent;
    if (!useLocalData && sb) {
      await sb.from('scores').update({ score, absent }).eq('id', existing.id);
    }
  } else {
    const newScore = { id: nextId.scores++, round_id: roundId, member_id: memberId, score, absent };
    state.scores.push(newScore);
    if (!useLocalData && sb) {
      const { data } = await sb.from('scores').insert([{ round_id: roundId, member_id: memberId, score, absent }]).select();
      if (data?.[0]) newScore.id = data[0].id;
    }
  }
}

async function updateRoundField(roundId, field, value) {
  const round = state.rounds.find(r => r.id === roundId);
  if (round) {
    round[field] = value;
    if (!useLocalData && sb) await sb.from('rounds').update({ [field]: value }).eq('id', roundId);
  }
}

// ═══════════════════════════════════════════
// 라운드 추가 모달
// ═══════════════════════════════════════════
function openRoundModal(teamId) {
  const team = state.teams.find(t => t.id === teamId);
  const members = state.members.filter(m => m.team_id === teamId).sort((a,b) => a.order - b.order);
  document.getElementById('roundTeamId').value = teamId;
  document.getElementById('roundTeamName').value = team?.name || '';
  document.getElementById('roundMonth').value = '';
  document.getElementById('roundDate').value = '';
  document.getElementById('roundNote').value = '';

  const scoreInputs = document.getElementById('scoreInputs');
  scoreInputs.innerHTML = '';
  for (const m of members) {
    scoreInputs.innerHTML += `
      <div class="score-input-item">
        <label>${m.name}</label>
        <input type="number" id="score_${m.id}" placeholder="타수 입력" min="50" max="200">
        <label class="absent-check">
          <input type="checkbox" id="absent_${m.id}" onchange="toggleAbsent(${m.id})">
          비참석
        </label>
      </div>`;
  }
  openModal('roundModal');
}

function toggleAbsent(memberId) {
  const absent = document.getElementById(`absent_${memberId}`).checked;
  const input = document.getElementById(`score_${memberId}`);
  input.disabled = absent;
  if (absent) input.value = '';
}

async function saveRound() {
  const teamId = parseInt(document.getElementById('roundTeamId').value);
  const month = document.getElementById('roundMonth').value;
  const date = document.getElementById('roundDate').value || null;
  const note = document.getElementById('roundNote').value.trim();
  if (!month) { showToast('월을 선택해주세요', 'error'); return; }

  const newRound = { id: nextId.rounds++, team_id: teamId, month, date, note };
  if (!useLocalData && sb) {
    const { data, error } = await sb.from('rounds').insert([{ team_id: teamId, month, date, note }]).select();
    if (error) { showToast('저장 실패: ' + error.message, 'error'); return; }
    if (data?.[0]) newRound.id = data[0].id;
  }
  state.rounds.push(newRound);

  const members = state.members.filter(m => m.team_id === teamId);
  for (const m of members) {
    const absent = document.getElementById(`absent_${m.id}`)?.checked || false;
    const val = document.getElementById(`score_${m.id}`)?.value;
    const score = absent ? null : (val ? parseInt(val) : null);
    if (score !== null || absent) {
      await upsertScore(newRound.id, m.id, score, absent);
    }
  }

  closeModal('roundModal');
  render();
  showToast('라운드가 추가되었습니다! ⛳', 'success');
}

async function deleteRound(roundId) {
  if (!confirm('이 라운드를 삭제할까요?')) return;
  state.scores = state.scores.filter(s => s.round_id !== roundId);
  state.rounds = state.rounds.filter(r => r.id !== roundId);
  if (!useLocalData && sb) {
    await sb.from('scores').delete().eq('round_id', roundId);
    await sb.from('rounds').delete().eq('id', roundId);
  }
  render();
  showToast('라운드가 삭제되었습니다', 'success');
}

// ═══════════════════════════════════════════
// 설정 모달
// ═══════════════════════════════════════════
function openSettingsModal() {
  const content = document.getElementById('settingsContent');
  content.innerHTML = '';
  for (const team of state.teams) {
    const members = state.members.filter(m => m.team_id === team.id).sort((a,b) => a.order - b.order);
    content.innerHTML += `
      <div style="margin-bottom:16px">
        <div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:0.9rem">
          ${team.order === 1 ? '🌸' : '⛳'} ${team.name}
        </div>
        ${members.map(m => `
          <div class="settings-member-row">
            <label>${m.order}번</label>
            <input type="text" id="member_${m.id}" value="${m.name}">
          </div>`).join('')}
      </div>
      <hr class="divider">`;
  }
  openModal('settingsModal');
}

async function saveSettings() {
  for (const m of state.members) {
    const input = document.getElementById(`member_${m.id}`);
    if (!input) continue;
    const newName = input.value.trim();
    if (newName && newName !== m.name) {
      m.name = newName;
      if (!useLocalData && sb) await sb.from('members').update({ name: newName }).eq('id', m.id);
    }
  }
  closeModal('settingsModal');
  render();
  showToast('멤버 이름이 저장되었습니다 ✅', 'success');
}

// ═══════════════════════════════════════════
// 유틸
// ═══════════════════════════════════════════
function openModal(id) {
  document.getElementById(id).classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  document.body.style.overflow = '';
}
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); });
});

function hideLoading() {
  const el = document.getElementById('loadingOverlay');
  if (el) { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }
}

let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type ? `show ${type}` : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}

// ═══════════════════════════════════════════
// START
// ═══════════════════════════════════════════
init();
</script>
</body>
</html>
